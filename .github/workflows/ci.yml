name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Demo app end to end
        working-directory: examples
        env:
          DEMO_PASS: secret-pass # demo-only password  ironprobe:ignore
        run: |
          node demo-app/server.js &
          sleep 1
          node ../bin/ironprobe.js run --only api,ui,crawl
      - name: Secret scan
        run: node bin/ironprobe.js scan .
