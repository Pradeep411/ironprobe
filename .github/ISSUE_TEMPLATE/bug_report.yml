name: Bug report
description: IronProbe did something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or a minimal config to reproduce
      description: Remove secrets and private URLs first.
      render: yaml
  - type: input
    id: versions
    attributes:
      label: IronProbe, Node.js and Playwright versions, and OS
      placeholder: ironprobe 0.1.0, node 22, playwright 1.63, macOS 15
