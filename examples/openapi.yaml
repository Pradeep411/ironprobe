openapi: 3.0.3
info: { title: Demo API (OpenAPI), version: 1.0.0 }
servers: [{ url: http://localhost:4010 }]
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  /api/items:
    get:
      operationId: listItems
      security: [{ bearer: [] }]
      responses:
        '200':
          description: items
          content:
            application/json:
              schema:
                type: object
                required: [items, count]
                properties:
                  count: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Item' } }
    post:
      operationId: createItem
      responses: { '201': { description: created } }
  /api/items/{id}:
    get:
      operationId: getItem
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
      responses:
        '200':
          description: one item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer } }
  schemas:
    Item:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
